# Netlify configuration — Galaxy Sport
# POMEMBNO: ta datoteka mora biti v KORENU repozitorija
# (poleg .pages.yml), ne v src/. Staro src/netlify.toml izbriši.

[build]
  command = "npm run build"
  publish = "_site"

  # Tu je bil nekoč "ignore" ukaz, ki je preskočil build, kadar je commit
  # spreminjal samo fotografije v src/images/uploads.
  #
  # Odstranjen 3. novembra 2026, ker je od 8. oktobra 2026 preskakoval
  # čisto vse buildove in se stran ni posodabljala skoraj mesec dni.
  #
  # Vzrok: brez predpomnilnika je $CACHED_COMMIT_REF prazen. Ukaz je takrat
  # dobil en sam argument namesto dveh, zato ni primerjal dveh commitov,
  # ampak delovno kopijo s trenutnim commitom. Ta je vedno čista, torej
  # izhod 0, torej preskoči. Preskočen build ne zapiše predpomnilnika,
  # zato se je stanje samo ohranjalo naprej.
  #
  # Če bo kdaj spet potreben, mora imeti varovalko, ki gradi, kadar
  # primerjalna točka manjka:
  #   ignore = "if [ -z \"$CACHED_COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)src/images/uploads'"
  # Pravilo: privzeto naj bo gradnja, ne preskok. Odvečen build stane
  # 20 sekund, odvečen preskok je stal mesec dni.

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[functions]
  directory = "netlify/functions"
